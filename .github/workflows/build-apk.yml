name: Build Live GPS APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install Cordova & Build Android APK
      run: |
        npm install -g cordova
        cordova create sholatApp com.sola.sholatapp SholatSola
        cd sholatApp
        cordova platform add android
        
        # Tambahkan plugin geolocation resmi Cordova agar akses GPS HP terbuka
        cordova plugin add cordova-plugin-geolocation --variable GEOLOCATION_USAGE_DESCRIPTION="Butuh akses GPS untuk jadwal sholat akurat"
        
        # Timpa file www
        rm -rf www/*
        cp -r ../www/* www/
        
        # Build APK Debug
        cordova build android --debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: JadwalSholatSola-LiveGPS
        path: sholatApp/platforms/android/app/build/outputs/apk/debug/app-debug.apk
