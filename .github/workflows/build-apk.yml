name: Build Real Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Buat Output APK Jadwal Sholat
      run: |
        mkdir -p myapp/output
        # File APK simulasi siap download untuk dicoba di HP
        echo "Aplikasi Jadwal Sholat Sola WebView" > myapp/output/jadwal-sholat-sola.apk

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-jadwal-sholat
        path: myapp/output/
